name: Update schedules

# Refreshes the team calendars from ArbiterLive and commits any real changes.
on:
  schedule:
    # Daily at 11:00 UTC (~6-7 AM Eastern). Adjust as needed.
    - cron: "0 11 * * *"
  workflow_dispatch:

# Least privilege: only allow writing repository contents (to push updates).
permissions:
  contents: write

concurrency:
  group: update-schedules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update schedules
        run: python update_schedule.py --quiet

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.ics
          if git diff --cached --quiet; then
            echo "No schedule changes to commit."
          else
            git commit -m "chore: update schedules [skip ci]"
            git push
          fi
